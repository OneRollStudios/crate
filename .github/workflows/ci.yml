name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: crate
        shell: bash
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      SCREENSHOT_DIR: screenshots

    steps:
      # Check out the code being tested.
      - name: Checkout
        uses: actions/checkout@v7

      # Cache npm downloads using the app's lockfile.
      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crate/package-lock.json

      # Install exactly the dependencies recorded in the lockfile.
      - name: Install dependencies
        run: npm ci

      # Build the registry and static site; Next.js also checks TypeScript.
      - name: Build
        id: build
        run: npm run build

      # Include newly generated files when detecting an outdated registry.
      - name: Registry in sync
        run: |
          git add --intent-to-add -- public/r/ registry.json
          git diff --exit-code -- public/r/ registry.json

      # Every link in llms.txt must point at a file in the static export.
      - name: LLM docs
        run: |
          test -s out/llms.txt
          site="https://crate.onerollstudios.com/"
          links=$(grep -oE "\]\(${site}[^)]+" out/llms.txt | sed 's/^](//')
          for url in $links; do
            test -s "out/${url#"$site"}" || { echo "llms.txt links a missing file: $url"; exit 1; }
          done
          echo "llms.txt links $(echo "$links" | wc -l) files, all present."

      # Report every em dash, and treat search errors as failures too.
      - name: Copy guard
        if: ${{ !cancelled() }}
        run: |
          if grep -rnF --exclude-dir=node_modules -- $'\u2014' app/ components/ ../examples/; then
            echo "Em dashes are not allowed in app/, components/, or examples/."
            exit 1
          else
            test "$?" -eq 1
          fi

      # Install Chromium and Linux libraries required by Playwright.
      - name: Install Chromium
        id: chromium
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npx playwright install --with-deps chromium

      # Check the static export, including desktop/mobile and light/dark.
      - name: Visual check
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: node scripts/visual-check.mjs

      # Exercise the registry in a fresh Next.js and shadcn consumer app, then
      # drive it through a mocked AI SDK stream in Chromium.
      - name: Install test
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: bash scripts/install-test.sh

      # The same install and stream test in a fresh Vite + React app.
      - name: Install test (Vite)
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: bash scripts/install-test.sh vite

      # Install into an app with its own shadcn theme (colors, radius, font)
      # and check every component takes its look from that theme.
      - name: Themed host test
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: bash scripts/install-test.sh themed

      # Build examples/real-chat in mock mode (no API key) and check that a
      # real useChat request walks AgentState through every state in order.
      - name: Real chat example
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: bash ../examples/real-chat/scripts/ci-test.sh

      # Preserve any screenshots produced, even when another step failed.
      - name: Upload screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: crate/screenshots/
          if-no-files-found: warn
